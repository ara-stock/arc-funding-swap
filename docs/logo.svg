  <path d="M248 256 H 440" fill="none" stroke="#ffffff" stroke-width="44" stroke-linecap="round"/>
  <circle cx="248" cy="256" r="40" fill="#ffffff"/>
  <circle cx="248" cy="256" r="16" fill="#1d4ed8"/>
</svg>
